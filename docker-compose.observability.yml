version: "3.9"

# FluidMCP Full Observability Stack — AI-Ready Edition
# ─────────────────────────────────────────────────────
# Signals collected:
#   Logs    → Promtail tails Docker json-file logs → Loki
#   Metrics → Prometheus scrapes /metrics every 10 s
#   Traces  → FluidMCP OTLP HTTP → Tempo
#   UI      → Grafana (all three datasources pre-wired)
#   AI      → observability-mcp exposes all signals as MCP tools
#             → registered in FluidMCP at /observability/mcp
#
# Usage:
#   cp .env.observability.example .env.observability
#   # Edit .env.observability — set GF_SECURITY_ADMIN_PASSWORD at minimum
#   docker compose -f docker-compose.observability.yml --env-file .env.observability up --build
#
# URLs (all bound to 127.0.0.1 — localhost only):
#   FluidMCP          http://localhost:8099
#   Grafana           http://localhost:3000   (credentials from .env.observability)
#   Prometheus        http://localhost:9090
#   Tempo             http://localhost:3200
#
# AI access (via MCP):
#   http://localhost:8099/observability/mcp   (MCP JSON-RPC endpoint)

services:

  # ── FluidMCP Gateway ──────────────────────────────────────────────────────
  fluidmcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluidmcp
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      PYTHONUNBUFFERED: "1"
      LOG_FORMAT: "json"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: "fluidmcp"
      OTEL_SERVICE_VERSION: "2.0.0"
      OTEL_EXPORTER: "jaeger"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
      # FMCP_BEARER_TOKEN: "${FMCP_BEARER_TOKEN}"
      # MONGODB_URI: "mongodb://mongo:27017"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "fluidmcp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks:
      - observability
    depends_on:
      - tempo

  # ── Observability MCP Server (AI access layer) ────────────────────────────
  # Exposes 8 MCP tools so any AI agent / Claude can query metrics, logs,
  # traces, and health directly — no human-in-the-loop required.
  # Registered in FluidMCP via the config file; accessible at:
  #   POST http://localhost:8099/observability/mcp
  observability-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observability-mcp
    command: ["python", "-m", "fluidmcp.observability.mcp_server.server"]
    environment:
      PYTHONUNBUFFERED: "1"
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      TEMPO_URL: "http://tempo:3200"
      FLUIDMCP_URL: "http://fluidmcp:8099"
    depends_on:
      fluidmcp:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Bound to 127.0.0.1. --web.enable-lifecycle intentionally omitted.
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - observability

  # ── Grafana Tempo (distributed tracing backend) ───────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    networks:
      - observability

  # ── Grafana Loki (log aggregation) ────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki.yml"]
    networks:
      - observability

  # ── Promtail (log shipper — no Docker socket) ─────────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["-config.file=/etc/promtail/promtail.yml"]
    depends_on:
      - loki
    networks:
      - observability

  # ── Grafana (visualization) ────────────────────────────────────────────────
  # Password MUST be set via GF_SECURITY_ADMIN_PASSWORD in .env.observability.
  # No default is provided — compose fails fast if unset.
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./examples/grafana-dashboard.json:/var/lib/grafana/dashboards/fluidmcp-metrics.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
