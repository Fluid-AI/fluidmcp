apiVersion: 1

datasources:
  # ── Prometheus (metrics) ──────────────────────────────────────────────────
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"
      exemplarTraceIdDestinations:
        # When Prometheus has an exemplar with a trace_id label,
        # clicking it opens the trace in Tempo automatically.
        - name: trace_id
          datasourceUid: tempo

  # ── Grafana Tempo (traces) ─────────────────────────────────────────────────
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      # Enable trace → logs correlation: clicking a span opens matching Loki logs
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: '{service="fluidmcp"} |= "${__span.traceId}"'
      # Enable trace → metrics correlation
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        queries:
          - name: "Request rate"
            query: "sum(rate(fluidmcp_requests_total{$$__tags}[5m]))"

  # ── Grafana Loki (logs) ────────────────────────────────────────────────────
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Enable logs → traces correlation: clicking a trace_id opens it in Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"
