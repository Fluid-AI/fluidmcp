global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "docker-compose"
    environment: "local"

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "fluidmcp"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["fluidmcp:8099"]
        labels:
          service: "fluidmcp-gateway"
          environment: "docker"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
