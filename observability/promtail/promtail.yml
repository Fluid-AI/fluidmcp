server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_files
    static_configs:
      - targets: ["localhost"]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - docker: {}

      - json:
          expressions:
            docker_tag: attrs.tag

      - labels:
          container:
            source: docker_tag

      - match:
          selector: '{container="fluidmcp"}'
          stages:
            - json:
                expressions:
                  level: level
                  trace_id: trace_id
                  span_id: span_id
                  msg: message
                  svc: service

            - labels:
                level:
                  source: level
                service:
                  source: svc

            - structured_metadata:
                traceID:
                  source: trace_id
                spanID:
                  source: span_id

            - output:
                source: msg
