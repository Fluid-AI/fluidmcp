stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Accept traces in multiple formats
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

# Pipeline: ingestion → block building → query
ingester:
  max_block_duration: 5m

# Local filesystem storage (swap for S3/GCS in production)
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Compaction keeps disk usage bounded
compactor:
  compaction:
    block_retention: 48h

# Expose metrics so Prometheus can scrape Tempo itself
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Query frontend for Grafana
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
