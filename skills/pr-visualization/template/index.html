<div class="shell">

  <main class="main" id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Details">
  <div class="drawer-resize" id="drawer-resize" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>
  <div class="drawer-head">
    <button type="button" class="icon-btn" id="drawer-back" title="Back" hidden>&#8592;</button>
    <div class="drawer-crumb" id="drawer-crumb"></div>
    <button type="button" class="icon-btn" id="drawer-wide" title="Make panel wider">&#8676;</button>
    <button type="button" class="icon-btn" id="drawer-close" title="Close (Esc)">&#10005;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>
