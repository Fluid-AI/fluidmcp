# CI: backend tests, Python static checks and the frontend build.
#
# Runs on every PR into development so a broken import or a failing test can't
# land silently (pytest collected 0 tests on development for six months before
# this workflow existed).
name: CI

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Match the production image (Dockerfile: python:3.10-slim). Some pins in
      # requirements.txt (numpy 1.24.0) have no wheels for newer Pythons.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff==0.17.3

      # Hard errors only: syntax errors and undefined names (F821 caught the
      # LLM start/stop NameError). Style rules are not enforced yet.
      - name: Ruff (syntax errors, undefined names)
        run: ruff check fluidmcp tests --select E9,F63,F7,F82 --output-format github

      # tests/test_e2e.py clones public GitHub repos and installs registry
      # packages, so it depends on the network and third-party code; it is run
      # manually. MongoDB-backed tests skip themselves when no MongoDB is reachable.
      # Runs even when ruff fails, so a PR shows both results in one pass
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -n 4 --ignore=tests/test_e2e.py

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fluidmcp/frontend
    steps:
      - uses: actions/checkout@v4

      # Match the production image (Dockerfile: NODE_VERSION=20)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fluidmcp/frontend/package-lock.json

      - run: npm ci

      # "build" is `tsc -b && vite build`, so this also typechecks
      - run: npm run build
